name: Initialize Khadamati database and admin
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Seed service catalog
        run: npm run seed:services
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: khadamati
      - name: Create first admin account
        run: npm run admin:create
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: khadamati
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME || 'مدير خدماتي' }}
